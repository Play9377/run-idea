<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Resource Planning - System Log</title>
    <style>
        /* 基础样式：模拟专业终端环境 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; 
            background: #000; color: #00ff00; 
            font-family: "Lucida Console", Monaco, monospace; 
            overflow: hidden; 
        }

        /* 摸鱼窗口层：初始隐藏 */
        .fish-frame {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            border: none; visibility: hidden;
            background: #fff;
        }

        /* 掩护层：模拟数据库或系统后台 */
        #work-mask {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            padding: 20px; font-size: 13px; line-height: 1.5;
            background: #1e1e1e; color: #cccccc;
            z-index: 100; overflow: hidden;
        }
        .log-entry { margin-bottom: 4px; }
        .timestamp { color: #888; margin-right: 10px; }
        .status-ok { color: #4ec9b0; }
        .status-warn { color: #dcdcaa; }

        /* 激活状态 */
        .active { visibility: visible !important; z-index: 200; }
        
        /* 底部极小提示（几乎不可见） */
        #hint {
            position: fixed; bottom: 5px; right: 5px;
            color: #333; font-size: 9px; z-index: 300;
            opacity: 0.3; pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- 1. 虚假工作层 -->
    <div id="work-mask">
        <div class="log-entry"><span class="timestamp">[10:42:01]</span> Initializing DB cluster connection... <span class="status-ok">SUCCESS</span></div>
        <div class="log-entry"><span class="timestamp">[10:42:03]</span> Querying table 'User_Permissions' (ID: 0x8821)...</div>
        <div class="log-entry"><span class="timestamp">[10:42:05]</span> <span class="status-warn">Warning:</span> Latency detected in Node-A.</div>
        <div class="log-entry"><span class="timestamp">[10:42:10]</span> Vacuuming database 'Production_Main'... 12% complete.</div>
        <div id="dynamic-logs"></div>
    </div>

    <!-- 2. 摸鱼内容层 (src 建议替换为你常看的站) -->
    <!-- 注意：部分网站禁止 iframe 嵌入，建议使用其移动版地址 -->
    <iframe id="slot1" class="fish-frame" src="https://play9377.github.io/play-music/"></iframe>
    <iframe id="slot2" class="fish-frame" src="https://play9377.github.io/"></iframe>
    <!-- D:\1.txt  这里可以是本地文本   -->
    <iframe id="slot3" class="fish-frame" src="https://play9377.github.io/Sorry-muamua/"></iframe>

    <div id="hint">Q:Mask | 1,2,3:Switch</div>

    <script>
        const frames = document.querySelectorAll('.fish-frame');
        const mask = document.getElementById('work-mask');
        const logBox = document.getElementById('dynamic-logs');

        // 模拟动态日志滚动，增强真实性
        setInterval(() => {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `<span class="timestamp">[${time}]</span> Thread_${Math.floor(Math.random()*100)} executing sync... <span class="status-ok">DONE</span>`;
            logBox.prepend(div);
            if(logBox.childNodes.length > 30) logBox.removeChild(logBox.lastChild);
        }, 5000);

        // 核心键盘监听逻辑
        document.addEventListener('keydown', (e) => {
            // 禁止 F12 等按键弹出控制台（可选）
            if(e.key === 'F12') e.preventDefault();

            // 功能实现
            switch(e.key.toLowerCase()) {
                case '1': // 切换到窗口1
                case '2':
                case '3':
                    const index = parseInt(e.key) - 1;
                    frames.forEach(f => f.classList.remove('active'));
                    mask.style.zIndex = "50"; // 掩护层降级
                    frames[index].classList.add('active');
                    break;
                
                case 'q': // 紧急遮盖键（按Q迅速切回工作）
                    frames.forEach(f => f.classList.remove('active'));
                    mask.style.zIndex = "200";
                    break;
            }
        });

        // 解决 iframe 点击后外层键盘监听失效的问题
        window.addEventListener('blur', () => {
            // 当焦点进入 iframe 时，过一段时间自动尝试把焦点拉回
            // 或者提醒用户点击一下侧边
            console.log("Focus lost - in iframe");
        });
    </script>
</body>
</html>
